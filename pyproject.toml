[project]
name = "miniagent-runtime"
version = "0.1.0"
description = "An observable, evaluable agent runtime"
requires-python = ">=3.11"
dependencies = [
    "openai>=1.50",
    "pydantic>=2.9",
    "python-dotenv>=1.0",
    "typer>=0.12",
    "rich>=13.9",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pyyaml>=6.0",
]

[project.scripts]
agentrt = "agentrt.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentrt"]